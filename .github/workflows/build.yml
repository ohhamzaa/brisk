name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Safety checks
        run: dotnet run --project tests/Brisk.Tests -c Release

      - name: Publish x64
        run: dotnet publish src/Brisk -c Release -r win-x64 -o dist/x64

      - name: Publish ARM64
        run: dotnet publish src/Brisk -c Release -r win-arm64 -p:PlatformTarget=ARM64 -o dist/arm64

      - name: Rename binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/x64/Brisk.exe out/Brisk.exe
          Copy-Item dist/arm64/Brisk.exe out/Brisk-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: brisk
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
